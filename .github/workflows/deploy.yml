# Builds openGym from the upstream repository and publishes it to GitHub Pages, so the app can be
# added to an iPhone home screen from Safari without a server of your own.
#
# What gets built is upstream's ordinary web build, unmodified. With no server behind it the app
# offers "Continue without account" (guest mode): everything is stored on the device. Passkeys,
# sync and Web Push reminders need the openGym API, which Pages cannot run.
#
# The upstream release is pinned in OPENGYM_VERSION. Edit that file to update; the push redeploys.
name: Deploy openGym to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - OPENGYM_VERSION
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream tag to build instead of OPENGYM_VERSION (e.g. v1.3.9). Leave empty for the pinned one.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UPSTREAM: DuarteSantos8/openGym
  # Used only if the upstream release does not name its own media CDN in package.json.
  DATASET_FALLBACK: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-$(tr -d '[:space:]' < OPENGYM_VERSION)}"
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$v' is not a release tag like v1.3.9 (check OPENGYM_VERSION)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building openGym $v" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.ver.outputs.version }}
          path: upstream

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/frontend/package-lock.json

      # --ignore-scripts: the web build only needs `vite build`. The one heavy postinstall
      # (@capacitor/assets -> sharp) draws native app icons and is not needed here.
      - run: npm ci --ignore-scripts
        working-directory: upstream/frontend

      # The ~140 MB of exercise images and GIFs are not hosted here: like upstream's own demo and
      # phone app, the build points at the dataset on jsDelivr, pinned to the commit the release
      # names in its build:mobile script.
      - name: Find media CDN
        id: media
        working-directory: upstream/frontend
        run: |
          node -e '
            const s = require("./package.json").scripts?.["build:mobile"] || ""
            const pick = k => (s.match(new RegExp(k + "=(\\S+)")) || [])[1] || ""
            const fb = process.env.DATASET_FALLBACK
            console.log("img=" + (pick("VITE_IMG_BASE") || fb + "/images/"))
            console.log("gif=" + (pick("VITE_GIF_BASE") || fb + "/videos/"))
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - run: npm run build
        working-directory: upstream/frontend
        env:
          VITE_IMG_BASE: ${{ steps.media.outputs.img }}
          VITE_GIF_BASE: ${{ steps.media.outputs.gif }}

      - name: Check the build
        working-directory: upstream/frontend/dist
        env:
          IMG: ${{ steps.media.outputs.img }}
        run: |
          test -f index.html && test -f sw.js && test -f manifest.json
          grep -rqF "$IMG" assets || { echo "::error::media CDN not in bundle"; exit 1; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: upstream/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
